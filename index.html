<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <title>Arithmetic Operations</title>
</head>
<body>

    <div class="calc-container">
        <h2>Arithmetic Operations</h2><br>

        <form>
            <input type="number" id="num1" placeholder="Enter the first number"><br>
            <input type="number" id="num2" placeholder="Enter the second number"><br><br>
            <div class="buttons">
                <button type="button" class="btn btn-primary" py-click="addition">Add</button>
                <button type="button" class="btn btn-secondary" py-click="subtraction">Subtract</button>
                <button type="button" class="btn btn-success" py-click="multiplication">Multiply</button>
                <button type="button" class="btn btn-warning" py-click="division">Divide</button>
                <button type="button" class="btn btn-info text-white" py-click="modulus">Modulus</button>
                <button type="button" class="btn btn-dark" py-click="exponentiation">Exponent</button>
                <button type="button" class="btn btn-danger" py-click="floor_division">Floor Division</button>
            </div>
        </form>

        <br>
        <div id="result" class="result"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
